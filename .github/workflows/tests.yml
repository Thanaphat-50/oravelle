# =======================================================
# รัน Test อัตโนมัติทุกครั้งที่ Push ขึ้น main หรือเปิด Pull Request
# - Laravel: php artisan test (PHP 8.4 เหมือน Laravel Cloud)
# - Flutter: flutter analyze
#
# ผลดูได้ที่แท็บ Actions บน GitHub (✅ ผ่าน / ❌ ไม่ผ่าน)
# หมายเหตุ: Laravel Cloud ยัง Deploy ทุกครั้งที่ Push
# ถ้าขึ้น ❌ ให้แก้แล้ว Push ใหม่ทันที
# =======================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, sqlite3, mbstring, fileinfo
          coverage: none

      # composer install รันคำสั่ง artisan ด้วย จึงต้องมี .env ก่อน
      - name: Prepare .env
        run: cp .env.example .env

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # คำขอพร้อมกันจริงบน MySQL (เหมือน Laravel Cloud): checkout ซ้ำ / ยกเลิกพร้อมกัน / หมดเวลาซ้อนกัน
  # ใช้ฐานข้อมูลทดสอบชั่วคราวใน GitHub Actions เท่านั้น (ไม่เกี่ยวกับฐานข้อมูลจริง)
  laravel-mysql-concurrency:
    name: Laravel concurrency (MySQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_api

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: oravelle_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, pdo_sqlite, sqlite3, mbstring, fileinfo
          coverage: none

      - name: Prepare .env
        run: cp .env.example .env

      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Run concurrency tests (MySQL)
        env:
          CONCURRENCY_TESTS: '1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: oravelle_test
          DB_USERNAME: root
          DB_PASSWORD: root
        # --fail-on-skipped: ถ้าทดสอบถูกข้าม (ตั้งค่าฐานข้อมูลไม่ครบ) ให้งานนี้ล้ม ไม่ผ่านแบบเงียบ ๆ
        run: php artisan test --filter=OrderConcurrencyTest --fail-on-skipped

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ทดสอบการเชื่อมต่อ / เข้าสู่ระบบ (test/services)
      - name: Test
        run: flutter test
